<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 960" width="540" height="960">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071d1b"/>
      <stop offset="60%" stop-color="#0a2a27"/>
      <stop offset="100%" stop-color="#051413"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f3c38"/>
      <stop offset="100%" stop-color="#092724"/>
    </linearGradient>
    <linearGradient id="playerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041211"/>
      <stop offset="100%" stop-color="#08221f"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#087c48"/>
      <stop offset="100%" stop-color="#149e5d"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="540" height="960" fill="url(#bg)"/>

  <!-- Status Bar -->
  <g fill="#9fbfa8" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">
    <text x="32" y="30">9:41</text>
    <text x="508" y="30" text-anchor="end">5G   100%</text>
  </g>

  <!-- App Header -->
  <g transform="translate(24, 48)">
    <rect width="492" height="54" rx="14" fill="#0c322e" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Logo placeholder -->
    <circle cx="28" cy="27" r="18" fill="#d7ed83"/>
    <text x="28" y="32" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#082d2c" text-anchor="middle">MC</text>
    
    <text x="56" y="24" font-family="system-ui, sans-serif" font-size="15" font-weight="800" fill="#ffffff">Modern Classes</text>
    <text x="56" y="42" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#8cb8a0">JEE &amp; NEET Portal</text>
    
    <rect x="396" y="14" width="84" height="26" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)"/>
    <text x="438" y="31" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#d6e3c9" text-anchor="middle">Batch 2026</text>
  </g>

  
  <!-- Live Stream Video Player -->
  <g transform="translate(24, 118)">
    <rect width="492" height="260" rx="16" fill="url(#playerGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1" filter="url(#shadow)"/>
    
    <!-- Video Content / Blackboard Simulation -->
    <rect x="16" y="16" width="460" height="228" rx="10" fill="#041a18"/>
    
    <!-- Optics ray diagram illustration -->
    <line x1="40" y1="130" x2="450" y2="130" stroke="#33665c" stroke-width="1.5" stroke-dasharray="4 4"/>
    <ellipse cx="245" cy="130" rx="14" ry="75" fill="none" stroke="#68baa0" stroke-width="2"/>
    <!-- Ray 1 -->
    <path d="M 60 70 L 245 70 L 400 170" fill="none" stroke="#d7ed83" stroke-width="2"/>
    <!-- Ray 2 -->
    <path d="M 60 70 L 245 130 L 400 185" fill="none" stroke="#68baa0" stroke-width="2"/>
    
    <text x="40" y="50" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Physics: Optics &amp; Wave Mechanics</text>
    <text x="40" y="70" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#8cb8a0">Er. Alok Kumar · Live Broadcast</text>

    <!-- Live Badge -->
    <g transform="translate(380, 34)">
      <rect width="70" height="24" rx="6" fill="#dc2626"/>
      <circle cx="16" cy="12" r="4" fill="#ffffff"/>
      <text x="36" y="16" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffffff">LIVE</text>
    </g>

    <!-- Player Controls Bar -->
    <g transform="translate(24, 215)">
      <rect width="444" height="20" rx="4" fill="rgba(0,0,0,0.5)"/>
      <circle cx="15" cy="10" r="5" fill="#d7ed83"/>
      <line x1="28" y1="10" x2="350" y2="10" stroke="#d7ed83" stroke-width="3"/>
      <line x1="350" y1="10" x2="430" y2="10" stroke="rgba(255,255,255,0.2)" stroke-width="3"/>
      <text x="390" y="13" font-family="system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#ffffff">48:12</text>
    </g>
  </g>

  <!-- Live Chat & Real-Time Q&A Section -->
  <g transform="translate(24, 396)">
    <rect width="492" height="470" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Tab Bar -->
    <g transform="translate(20, 20)">
      <rect width="130" height="32" rx="8" fill="#087c48"/>
      <text x="65" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Live Q&amp;A (42)</text>
      
      <rect x="142" y="0" width="130" height="32" rx="8" fill="rgba(255,255,255,0.06)"/>
      <text x="207" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#8cb8a0" text-anchor="middle">Lecture Notes</text>
    </g>

    <!-- Message 1 -->
    <g transform="translate(20, 72)">
      <rect width="452" height="68" rx="10" fill="rgba(0,0,0,0.25)"/>
      <circle cx="24" cy="24" r="14" fill="#184e46"/>
      <text x="24" y="28" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">RK</text>
      <text x="48" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Rahul Kumar <tspan fill="#8cb8a0" font-weight="400">· 2m ago</tspan></text>
      <text x="48" y="44" font-family="system-ui, sans-serif" font-size="12" fill="#d6e3c9">Sir, what is the critical angle condition for total internal reflection?</text>
    </g>

    <!-- Message 2 (Teacher Verified Answer) -->
    <g transform="translate(20, 150)">
      <rect width="452" height="88" rx="10" fill="rgba(8,124,72,0.18)" stroke="rgba(104,186,160,0.3)" stroke-width="1"/>
      <circle cx="24" cy="24" r="14" fill="#087c48"/>
      <text x="24" y="28" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">FAC</text>
      <text x="48" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#d7ed83">Faculty · Modern Classes <tspan fill="#8cb8a0" font-weight="400">· 1m ago</tspan></text>
      <text x="48" y="44" font-family="system-ui, sans-serif" font-size="12" fill="#ffffff">θ &gt; θ_c = sin⁻¹(n₂/n₁) where light travels from denser to rarer medium.</text>
      <text x="48" y="66" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#68baa0">Formula Sheet Chapter 14 attached</text>
    </g>

    <!-- Message 3 -->
    <g transform="translate(20, 248)">
      <rect width="452" height="68" rx="10" fill="rgba(0,0,0,0.25)"/>
      <circle cx="24" cy="24" r="14" fill="#184e46"/>
      <text x="24" y="28" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle">PS</text>
      <text x="48" y="22" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Priya Sharma <tspan fill="#8cb8a0" font-weight="400">· Just now</tspan></text>
      <text x="48" y="44" font-family="system-ui, sans-serif" font-size="12" fill="#d6e3c9">Got it sir, the lens formula signs match the revision sheet.</text>
    </g>

    <!-- Input bar simulation -->
    <g transform="translate(20, 400)">
      <rect width="452" height="48" rx="10" fill="#08221f" stroke="rgba(255,255,255,0.1)"/>
      <text x="20" y="29" font-family="system-ui, sans-serif" font-size="12" fill="#688f82">Ask a question to faculty during live class...</text>
      <rect x="370" y="8" width="68" height="32" rx="8" fill="#087c48"/>
      <text x="404" y="28" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">Send</text>
    </g>
  </g>


  <!-- Bottom Navigation Bar -->
  <g transform="translate(0, 888)">
    <rect width="540" height="72" fill="#061c1a" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <!-- Nav Items -->
    <g font-family="system-ui, sans-serif" font-size="10" font-weight="700" text-anchor="middle">
      <g transform="translate(68, 28)">
        <circle cx="0" cy="0" r="12" fill="rgba(255,255,255,0.06)"/>
        <text x="0" y="24" fill="#8cb8a0">Live</text>
      </g>
      <g transform="translate(176, 28)">
        <circle cx="0" cy="0" r="12" fill="rgba(255,255,255,0.06)"/>
        <text x="0" y="24" fill="#8cb8a0">Tests</text>
      </g>
      <g transform="translate(270, 28)">
        <circle cx="0" cy="0" r="12" fill="rgba(255,255,255,0.06)"/>
        <text x="0" y="24" fill="#8cb8a0">Vault</text>
      </g>
      <g transform="translate(364, 28)">
        <circle cx="0" cy="0" r="12" fill="rgba(255,255,255,0.06)"/>
        <text x="0" y="24" fill="#8cb8a0">Doubts</text>
      </g>
      <g transform="translate(460, 28)">
        <circle cx="0" cy="0" r="12" fill="rgba(255,255,255,0.06)"/>
        <text x="0" y="24" fill="#8cb8a0">Profile</text>
      </g>
    </g>
  </g>

  <!-- Home Indicator Bar -->
  <rect x="210.0" y="946" width="120" height="4" rx="2" fill="rgba(255,255,255,0.3)"/>
</svg>