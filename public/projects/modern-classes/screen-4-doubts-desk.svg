  <!-- Doubts Thread -->
  <g transform="translate(24, 268)">
    <rect width="492" height="598" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    
    <!-- Ticket 1 (Resolved) -->
    <g transform="translate(20, 20)">
      <rect width="452" height="268" rx="12" fill="rgba(0,0,0,0.25)" stroke="rgba(255,255,255,0.05)"/>
      
      <rect x="16" y="16" width="68" height="22" rx="6" fill="rgba(8,124,72,0.2)"/>
      <text x="50" y="32" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#68baa0" text-anchor="middle">SOLVED</text>
      <text x="94" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#8cb8a0">Ticket #1042 · Rotational Dynamics</text>

      <text x="16" y="64" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">How to compute Moment of Inertia of a solid cone about its axis?</text>
      <text x="16" y="86" font-family="system-ui, sans-serif" font-size="12" fill="#d6e3c9">Submitted with textbook image · Er. Kumar resolved in 22 mins</text>

      <!-- Faculty Answer Box -->
      <g transform="translate(16, 102)">
        <rect width="420" height="146" rx="10" fill="rgba(8,124,72,0.14)" stroke="rgba(104,186,160,0.25)" stroke-width="1"/>
        <text x="14" y="22" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#d7ed83">Faculty Verification · Er. Alok Kumar</text>
        <text x="14" y="44" font-family="system-ui, sans-serif" font-size="11.5" fill="#ffffff">Take elemental disk of radius r at depth z: dm = ρ · πr² dz</text>
        <text x="14" y="66" font-family="system-ui, sans-serif" font-size="11.5" fill="#ffffff">dI = (1/2) dm · r² = (3M / 10) R² upon integration from 0 to h.</text>
        
        <!-- Formula highlight -->
        <rect x="14" y="80" width="220" height="28" rx="6" fill="#041816"/>
        <text x="24" y="99" font-family="system-ui, sans-serif" font-size="12" font-weight="800" fill="#d7ed83">I_axis = (3/10) M R²</text>
        
        <text x="14" y="130" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#68baa0">Step-by-step PDF derivation saved to your notes vault</text>
      </g>
    </g>

    <!-- Ticket 2 (In Progress) -->
    <g transform="translate(20, 304)">
      <rect width="452" height="140" rx="12" fill="rgba(0,0,0,0.25)" stroke="rgba(255,255,255,0.05)"/>
      <rect x="16" y="16" width="94" height="22" rx="6" fill="rgba(217,119,6,0.2)"/>
      <text x="63" y="32" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#fbbf24" text-anchor="middle">FACULTY REVIEW</text>
      <text x="120" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#8cb8a0">Ticket #1043 · Organic Chemistry</text>
      
      <text x="16" y="64" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Aldol Condensation vs Cannizzaro Reaction priority under conc. NaOH</text>
      <text x="16" y="86" font-family="system-ui, sans-serif" font-size="12" fill="#d6e3c9">Assigned to Chemistry department · Estimated response: 15 mins</text>
      <text x="16" y="114" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#8cb8a0">Attached screenshot: Question 42 from Mock Test 04</text>
    </g>

    <!-- Ticket 3 -->
    <g transform="translate(20, 460)">
