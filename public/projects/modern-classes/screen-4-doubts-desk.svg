      <rect x="16" y="16" width="68" height="22" rx="6" fill="rgba(8,124,72,0.2)"/>
      <text x="50" y="32" font-family="system-ui, sans-serif" font-size="10.5" font-weight="800" fill="#68baa0" text-anchor="middle">SOLVED</text>
      <text x="94" y="32" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#8cb8a0">Ticket #1041 · Mathematics</text>
      <text x="16" y="64" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Integration of e^x · (sin x + cos x) dx trick</text>
      <text x="16" y="90" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#68baa0">Solved · Standard form e^x · f(x) + C</text>
    </g>
